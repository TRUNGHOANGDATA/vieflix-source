# Build file cài iOS (.ipa) trên máy ảo macOS của GitHub — MIỄN PHÍ.
# KHÔNG ký (--no-codesign); AltStore sẽ tự ký bằng Apple ID của bạn khi cài.
#
# Cách dùng:
#   1) Vào tab "Actions" trên GitHub -> chọn "Build iOS IPA" -> "Run workflow".
#   2) Chờ ~10-15 phút, tải "VieFlix-ios-ipa" ở mục Artifacts của lần chạy.
#   3) Đưa file .ipa vào iPad bằng AltStore (AltServer trên Windows).
#
# Vì sao gói .ipa thủ công: `flutter build ios --no-codesign` chỉ ra Runner.app,
# chưa phải .ipa. Bọc app vào thư mục Payload/ rồi nén lại thành .ipa — đây là
# .ipa chưa ký, AltStore ký lại lúc cài nên hợp lệ.
name: Build iOS IPA

on:
  workflow_dispatch:        # bấm nút chạy tay trên GitHub
  push:
    tags: ['v*']            # đẩy tag phiên bản cũng build luôn

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cài Flutter (khớp bản đang dùng)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Lấy gói phụ thuộc
        run: flutter pub get

      - name: Kiểm tra nhanh (không chặn build nếu chỉ cảnh báo)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build iOS (chưa ký)
        run: flutter build ios --release --no-codesign

      # `ldid` của AltStore chỉ đọc được Mach-O MỘT kiến trúc. Bản build để lại
      # vài binary "fat" (nhiều kiến trúc) — đo thật trên .ipa thấy
      # App.framework/App và objective_c.framework/objective_c — khiến ldid đọc
      # header fat như header thường, offset vọt ra ngoài file rồi vỡ:
      #   ldid.cpp(1461): _assert(): end >= size - 0x10
      # Cắt còn arm64 TRƯỚC khi ký (lipo làm hỏng chữ ký nên phải ký lại sau).
      - name: Cắt binary về một kiến trúc arm64 (ldid không đọc được file fat)
        run: |
          APP=build/ios/iphoneos/Runner.app
          thin_one() {
            f="$1"
            [ -f "$f" ] || return 0
            if lipo -info "$f" 2>/dev/null | grep -q "Architectures in the fat file"; then
              echo "  cat fat -> arm64: $f"
              lipo "$f" -thin arm64 -output "$f.thin" && mv -f "$f.thin" "$f"
            fi
          }
          thin_one "$APP/Runner"
          if [ -d "$APP/Frameworks" ]; then
            for fw in "$APP"/Frameworks/*.framework; do
              [ -d "$fw" ] || continue
              thin_one "$fw/$(basename "$fw" .framework)"
            done
            for dy in "$APP"/Frameworks/*.dylib; do thin_one "$dy"; done
          fi
          echo "--- con file fat nao khong (phai TRONG) ---"
          find "$APP" -type f -exec sh -c 'lipo -info "$1" 2>/dev/null | grep -q "fat file" && echo "CON FAT: $1"' _ {} \; || true

      # AltStore ký lại app bằng `ldid`. Với bản build --no-codesign, các
      # framework để lại chữ ký DỞ/thiếu -> ldid vỡ:
      #   ldid.cpp(1461): _assert(): end >= size - 0x10
      # Ad-hoc ký sạch (codesign -s -) từng framework/dylib rồi tới app: chữ ký
      # thành hợp lệ, ldid parse và thay được. KHÔNG xoá _CodeSignature — thiếu
      # nó ldid càng vỡ.
      - name: Ad-hoc ký lại toàn bộ (để AltStore ký đè được)
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -name "*.dylib" -exec codesign --force --sign - {} \;
            find "$APP/Frameworks" -maxdepth 1 -name "*.framework" -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -5

      - name: Đóng gói thành .ipa (ditto — zip thường AltStore hay không đọc được)
        run: |
          cd build/ios/iphoneos
          rm -rf Payload VieFlix.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          ditto -c -k --norsrc --noextattr --keepParent Payload VieFlix.ipa
          echo "Đã tạo: $(pwd)/VieFlix.ipa"
          unzip -l VieFlix.ipa | head -6

      - name: Đưa .ipa ra Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: VieFlix-ios-ipa
          path: build/ios/iphoneos/VieFlix.ipa
          if-no-files-found: error
