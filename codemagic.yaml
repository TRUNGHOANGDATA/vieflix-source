# Dựng file cài iPad (.ipa) trên máy ảo macOS của Codemagic.
#
# Vì sao có file này: build iOS bắt buộc chạy trên macOS. GitHub Actions tính
# phút macOS gấp 10 lần nên hết hạn mức rất nhanh với tài khoản thường.
# Codemagic có gói miễn phí dùng được với repo RIÊNG TƯ (kiểm lại số phút trên
# trang của họ, giá hay đổi).
#
# CÁCH DÙNG: codemagic.io -> đăng nhập bằng GitHub -> Add application -> chọn
# repo này -> nó tự thấy file này -> Start new build. Xong tải .ipa ở mục
# Artifacts.
#
# Toàn bộ việc dựng nằm trong tool/build-ipa-mac.sh để CI và máy Mac cầm tay
# chạy CÙNG một thứ, khỏi lệch nhau.
workflows:
  ios-ipa:
    name: VieFlix iOS (.ipa chưa ký)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.44.9
      # Khóa TMDB nhúng lúc build. Thêm trong Codemagic: Environment variables
      # -> TMDB_KEY (nhớ bật "Secure"). Không có cũng build được.
      groups:
        - tmdb
    scripts:
      - name: Dựng .ipa
        script: bash tool/build-ipa-mac.sh
    artifacts:
      - build/ios/iphoneos/VieFlix.ipa
    # Muốn nhận file qua email thì bỏ chú thích và điền địa chỉ:
    # publishing:
    #   email:
    #     recipients:
    #       - ban@example.com
